name: Deploy production

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tria-production
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

  deploy:
    name: Build and deploy to VPS
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo 'Missing secret: VPS_HOST'; exit 1; }
          test -n "$VPS_USER" || { echo 'Missing secret: VPS_USER'; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo 'Missing secret: VPS_SSH_KEY'; exit 1; }
          test -n "$VPS_PORT" || { echo 'Missing secret: VPS_PORT'; exit 1; }

      - name: Prepare deploy package
        run: |
          set -euo pipefail
          mkdir -p deploy_dist
          rsync -a \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.env.production' \
            --exclude '*.log' \
            --exclude 'deploy_dist/' \
            --exclude 'public/images/tria_logo_original.png' \
            ./ deploy_dist/
          tar -C deploy_dist -czf tria-deploy.tgz .
          ls -lh tria-deploy.tgz

      - name: Upload package to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: tria-deploy.tgz
          target: /tmp/tria-upload-${{ github.run_id }}
          rm: true
          overwrite: true
          timeout: 120s
          command_timeout: 10m

      - name: Deploy and verify
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -Eeuo pipefail

            APP_DIR="${{ vars.VPS_APP_DIR || '/opt/tria' }}"
            UPLOAD_DIR="/tmp/tria-upload-${{ github.run_id }}"
            PACKAGE="$UPLOAD_DIR/tria-deploy.tgz"
            if [ ! -f "$PACKAGE" ]; then
              PACKAGE="$UPLOAD_DIR/tria-deploy.tgz/tria-deploy.tgz"
            fi
            test -f "$PACKAGE"

            mkdir -p "$APP_DIR"
            test -f "$APP_DIR/.env.production" || {
              echo "Missing required runtime file: $APP_DIR/.env.production"
              exit 1
            }

            # Keep DB credentials file across releases, drop stale app code.
            BACKUP_DIR="$(mktemp -d /tmp/tria-deploy.XXXXXX)"
            cp "$APP_DIR/.env.production" "$BACKUP_DIR/.env.production"
            find "$APP_DIR" -mindepth 1 -maxdepth 1 \
              ! -name '.env.production' ! -name 'runtime' -exec rm -rf {} +
            tar -xzf "$PACKAGE" -C "$APP_DIR"
            cp "$BACKUP_DIR/.env.production" "$APP_DIR/.env.production"
            rm -rf "$BACKUP_DIR"

            cd "$APP_DIR"

            # Compose reads interpolation vars (POSTGRES_*) from the shell or
            # `.env`, not from a service-level env_file, so export them first.
            set -a
            . "$APP_DIR/.env.production"
            set +a

            # First release: initialise the schema and demo data exactly once.
            if [ ! -f "$APP_DIR/runtime/.db-initialized" ]; then
              docker compose -f deploy/docker-compose.prod.yml run --rm \
                -w /app web npx prisma db push --skip-generate
              mkdir -p "$APP_DIR/runtime"
              touch "$APP_DIR/runtime/.db-initialized"
            fi

            if ! docker compose -f deploy/docker-compose.prod.yml up -d --build --remove-orphans; then
              echo 'Docker Compose failed. Container logs follow:'
              docker compose -f deploy/docker-compose.prod.yml logs --tail 200 || true
              docker compose -f deploy/docker-compose.prod.yml ps || true
              exit 1
            fi

            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8082/ >/dev/null; then
                rm -rf "$UPLOAD_DIR"
                docker image prune -f
                echo 'Deploy done'
                exit 0
              fi
              sleep 3
            done

            docker compose -f deploy/docker-compose.prod.yml ps
            docker compose -f deploy/docker-compose.prod.yml logs --tail 100 web || true
            exit 1
